# A股收盘 · 资金流向监控 —— 每日自动生成并部署 GitHub Pages
#
# 触发：
#   - push      : 每次推送到 main 即运行（可当作手动刷新）
#   - schedule  : 每个交易日 15:45（北京时间）= 07:45 UTC 收盘后运行（周一至周五）
#   - workflow_dispatch : 支持手动触发（Actions 页 → Run workflow）
#
# 流程：checkout → 运行 main.py（统一生成 fundflow + stocktrend 页面）
#       → 把 build/fundflow.html 作为站点根 index.html 上传，并附带 stocktrend 页面 → deploy-pages
#
# 前置要求（一次性）：
#   仓库 Settings → Pages → Source 选「GitHub Actions」，之后每次运行自动更新站点。
name: A股收盘资金流日报-自动生成部署

on:
  push:
    branches: [main]      # 每次 push 到 main 都运行（也可手动刷新）
  schedule:
    - cron: '45 7 * * 1-5'   # 周一至周五 07:45 UTC = 15:45 北京时间
  workflow_dispatch: {}      # 手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行主脚本（统一生成 JSON 中间产物 + HTML 到 build/）
        env:
          TZ: Asia/Shanghai
          REQ_DELAY: '0.4'   # 请求间隔，避免触发数据源限流
        run: |
          . .venv/bin/activate
          python main.py
          echo "--- build/ 内容 ---"
          ls -la build/

      - name: 检查报告生成
        run: |
          test -f build/fundflow.html && echo "✓ 报告已生成"
          test -f build/stocktrend_ashare.html && echo "✓ A股 stocktrend 已生成"
          test -f build/stocktrend_hk.html && echo "✓ 港股 stocktrend 已生成"
          echo "「数据暂缺」占位数: $(grep -c '数据暂缺' build/fundflow.html || true)"
          echo "「<script>」数: $(grep -c '<script' build/fundflow.html || true)"

      - name: 组装 Pages 站点（根路径直接展示报告）
        run: |
          mkdir -p site
          cp build/fundflow.html site/index.html
          cp build/fundflow.html site/fundflow.html
          cp build/stocktrend_ashare.html site/stocktrend_ashare.html
          cp build/stocktrend_hk.html site/stocktrend_hk.html
          ls -la site/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
