# 股票静态报告 —— 每日（交易日）自动生成并部署 GitHub Pages
#
# 统一入口：每个交易日收盘后，全量重建 资金流日报（A股+港股）+ 个股走势（A股+港股）+ 导航首页，
# 一并部署。不再按模块拆分频率（历史曾为「资金流每日 + 个股走势每周五」）。
#
# 触发：
#   - push      : 每次推送到 main 即运行（可当作手动刷新）
#   - schedule  : 每个交易日 16:00（北京时间）= 08:00 UTC 收盘后运行（周一至周五，覆盖 A股15:00 + 港股16:10 双收盘）
#   - workflow_dispatch : 支持手动触发
name: 股票日报-每日

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1-5'   # 周一至周五 08:00 UTC = 16:00 北京时间
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 build/cache（跨运行复用，减少重复请求）
        uses: actions/cache@v4
        with:
          path: build/cache
          key: stockvoyager-cache-${{ github.run_id }}
          restore-keys: |
            stockvoyager-cache-

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 全量生成报告（资金流 + 个股走势 + 导航首页）
        env:
          TZ: Asia/Shanghai
          REQ_DELAY: '0.4'   # 请求间隔，避免触发数据源限流
        run: |
          . .venv/bin/activate
          python main.py
          echo "--- build/site 内容 ---"
          ls -la build/site/

      - name: 检查报告生成
        run: |
          test -f build/site/index.html && echo "✓ 导航首页已生成"
          test -f build/site/fundflow.html && echo "✓ A股资金流日报已生成"
          test -f build/site/fundflow_hk.html && echo "✓ 港股资金流日报已生成"
          test -f build/site/fundflow_us.html && echo "✓ 美股资金流日报已生成"
          test -f build/site/stocktrend_ashare.html && echo "✓ A股个股走势已生成"
          test -f build/site/stocktrend_hk.html && echo "✓ 港股个股走势已生成"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
