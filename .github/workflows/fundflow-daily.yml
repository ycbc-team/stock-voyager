# A股资金流日报 —— 每日（交易日）自动生成并部署 GitHub Pages
#
# 触发：
#   - push      : 每次推送到 main 即运行（可当作手动刷新）
#   - schedule  : 每个交易日 16:00（北京时间）= 08:00 UTC 收盘后运行（周一至周五，覆盖 A股15:00 收盘；港股16:10 收盘前10分钟，如需完整港股数据可改回 16:30）
#   - workflow_dispatch : 支持手动触发
#
# 只重新生成资金流日报（fundflow.html）+ 导航首页；
# 两个走势 tab（stocktrend_ashare.html / stocktrend_hk.html）按「每周五更新一次」的节奏保持不变，
# 本流程从已部署站点把这两个旧页面拉回，随资金流一起重新发布，保证站点完整。
name: A股资金流日报-每日

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1-5'   # 周一至周五 08:00 UTC = 16:00 北京时间
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成资金流日报 + 导航首页（只刷新 fundflow）
        env:
          TZ: Asia/Shanghai
          REQ_DELAY: '0.4'   # 请求间隔，避免触发数据源限流
        run: |
          . .venv/bin/activate
          python main.py --only fundflow
          echo "--- build/site 内容 ---"
          ls -la build/site/

      - name: 拉回已部署的走势页（保持每周五版本不变）
        run: |
          mkdir -p build/site
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}/"
          for f in stocktrend_ashare.html stocktrend_hk.html; do
            echo "尝试拉回 $BASE$f"
            curl -fsSL "$BASE$f" -o "build/site/$f" || echo "（首次运行或暂缺，跳过 $f）"
          done
          echo "--- build/site 最终内容 ---"
          ls -la build/site/

      - name: 检查报告生成
        run: |
          test -f build/site/index.html && echo "✓ 导航首页已生成"
          test -f build/site/fundflow.html && echo "✓ 资金流日报已生成"
          echo "「数据暂缺」占位数: $(grep -c '数据暂缺' build/site/fundflow.html || true)"
          echo "「<script>」数: $(grep -c '<script' build/site/fundflow.html || true)"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
